<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>藏书馆 · 我的书架</title>
<style>
:root{
  --gold:#c9a227;
  --paper:#f7f1e3;
  --ink:#2a2018;
  --pad-y:52px; --pad-x:56px;
  --read-fs:17px; --read-lh:2;
}
*{box-sizing:border-box;}
html,body{margin:0;min-height:100%;}
body{
  font-family:"Noto Serif SC","Songti SC",STSong,"SimSun",serif;
  background:#120c0a;
  color:#e9dcc4;
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 70% 50% at 50% -10%, rgba(160,110,60,.28), transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 110%, rgba(90,60,35,.20), transparent 70%);
}

/* ---------- 顶栏 ---------- */
.topbar{
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:space-between;
  gap:20px;flex-wrap:wrap;
  padding:30px 44px 26px;
}
.brand{
  margin:0;font-size:22px;font-weight:400;
  letter-spacing:.5em;color:#e5d3a8;
  text-shadow:0 2px 14px rgba(201,162,39,.25);
}
.brand span{color:var(--gold);}
.btn{
  font-family:inherit;font-size:13px;letter-spacing:.1em;
  padding:10px 20px;border-radius:2px;cursor:pointer;
  border:1px solid rgba(201,162,39,.45);
  background:transparent;color:#d8c48a;
  transition:.25s;
}
.btn:hover{background:rgba(201,162,39,.14);border-color:var(--gold);}
.btn-sm{padding:7px 14px;font-size:12px;}
.btn-primary{
  background:linear-gradient(180deg,#d4ae3a,#b8901f);
  border-color:#d4ae3a;color:#1a1208;font-weight:600;
}
.btn-primary:hover{filter:brightness(1.08);}

/* ---------- 书架 ---------- */
#shelf{position:relative;z-index:1;padding:10px 0 70px;}
.shelf-row{display:flex;flex-direction:column;}
.books{
  display:flex;align-items:flex-end;gap:10px;
  padding:0 44px;min-height:40px;
}
.plank{
  height:14px;margin:0 24px 40px;border-radius:4px;
  background:linear-gradient(180deg,#6b4a2f,#3d2717 45%,#241610);
  box-shadow:0 14px 26px -6px rgba(0,0,0,.8), inset 0 2px 0 rgba(255,220,160,.09);
}
.empty{
  text-align:center;padding:90px 20px;
  color:rgba(233,220,196,.35);letter-spacing:.15em;font-size:14px;
}

/* ---------- 书脊 ---------- */
.book{
  position:relative;flex:none;width:52px;
  height:var(--h,190px);cursor:pointer;
  transform-origin:50% 100%;
  transition:transform .45s cubic-bezier(.2,.9,.3,1), filter .3s;
}
.book:hover{transform:translateY(-16px) rotate(-1.5deg);filter:brightness(1.12);}
.book:active{transform:translateY(-6px) scale(.98);}
.spine{
  position:absolute;inset:0;overflow:hidden;
  border-radius:2px 6px 6px 2px;
  background:linear-gradient(90deg,
    rgba(0,0,0,.6) 0%,
    rgba(255,255,255,.12) 5%,
    var(--c) 16%,
    var(--c) 60%,
    rgba(255,255,255,.08) 84%,
    rgba(0,0,0,.5) 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.07),
    0 8px 18px -4px rgba(0,0,0,.7);
}
.spine::before{
  content:"";position:absolute;left:7px;right:7px;top:42px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(230,200,130,.6),transparent);
}
.b-title{
  position:absolute;top:56px;left:50%;transform:translateX(-50%);
  writing-mode:vertical-rl;
  font-size:14px;letter-spacing:4px;line-height:1;
  color:#f4e8cf;text-shadow:0 1px 3px rgba(0,0,0,.7);
  max-height:calc(100% - 120px);overflow:hidden;pointer-events:none;
}
.b-author{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  writing-mode:vertical-rl;
  font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.42);
  max-height:36%;overflow:hidden;pointer-events:none;
}

/* ---------- 阅读器 ---------- */
.reader{
  position:fixed;inset:0;z-index:60;
  display:flex;flex-direction:column;
  background:#0b0806;
  background-image:radial-gradient(ellipse 60% 50% at 50% 35%, rgba(120,85,50,.35), transparent 70%);
  opacity:0;pointer-events:none;
  transition:opacity .35s ease;
}
.reader.open{opacity:1;pointer-events:auto;}
.reader-top{
  display:flex;align-items:center;gap:14px;
  padding:18px 30px;font-size:13px;letter-spacing:.08em;
  color:rgba(233,220,196,.65);
}
.reader-title{
  flex:1;text-align:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.reader-progress{
  min-width:64px;text-align:right;
  font-variant-numeric:tabular-nums;color:rgba(233,220,196,.45);
}
.stage{
  flex:1;min-height:0;
  display:flex;align-items:center;justify-content:center;
  gap:16px;padding:0 20px 30px;
}
.nav-btn{
  flex:none;width:46px;height:46px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:serif;font-size:22px;line-height:1;
  border:1px solid rgba(201,162,39,.35);
  background:rgba(255,255,255,.03);
  color:#d8c48a;cursor:pointer;transition:.25s;
}
.nav-btn:hover:not(:disabled){background:rgba(201,162,39,.15);}
.nav-btn:disabled{opacity:.18;cursor:default;}
.page-viewport{
  position:relative;overflow:hidden;
  width:min(720px,88vw);
  height:min(900px,calc(100vh - 150px));
  background:var(--paper);border-radius:3px;
  box-shadow:
    0 50px 90px -30px rgba(0,0,0,.9),
    0 0 0 1px rgba(0,0,0,.5),
    inset -20px 0 40px -30px rgba(0,0,0,.6);
}
.page-inner{
  height:100%;
  padding:var(--pad-y) var(--pad-x);
  overflow:hidden;
  color:var(--ink);
  font-size:var(--read-fs);
  line-height:var(--read-lh);
  animation:fadePage .32s ease;
}
@keyframes fadePage{
  from{opacity:0;transform:translateY(6px);}
  to{opacity:1;transform:none;}
}
.page-inner p{margin:0 0 1.05em;text-indent:2em;}
.page-inner p:last-child{margin-bottom:0;}

/* 分页测量用的隐藏容器 */
.page-measure{
  position:fixed;left:-99999px;top:0;visibility:hidden;
  font-size:var(--read-fs);line-height:var(--read-lh);color:var(--ink);
}
.page-measure p{margin:0 0 1.05em;text-indent:2em;}

/* ---------- 弹窗 ---------- */
.modal{
  position:fixed;inset:0;z-index:80;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  background:rgba(5,3,2,.78);
  backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:.3s;
}
.modal.open{opacity:1;pointer-events:auto;}
.modal-card{
  width:min(540px,94vw);max-height:88vh;overflow:auto;
  background:#1c1512;border-radius:6px;padding:28px;
  border:1px solid rgba(201,162,39,.25);
  box-shadow:0 30px 70px rgba(0,0,0,.75);
}
.modal-title{
  margin:0 0 22px;font-size:17px;font-weight:400;
  letter-spacing:.25em;color:#e5d3a8;
}
.field{margin-bottom:16px;}
.field label{
  display:block;margin-bottom:8px;
  font-size:12px;letter-spacing:.15em;
  color:rgba(233,220,196,.55);
}
.field input,.field textarea{
  width:100%;font-family:inherit;font-size:14px;
  padding:10px 12px;border-radius:3px;outline:none;
  background:#120d0b;color:#e9dcc4;
  border:1px solid rgba(201,162,39,.2);
  transition:.2s;
}
.field input:focus,.field textarea:focus{border-color:rgba(201,162,39,.65);}
.field textarea{min-height:170px;resize:vertical;line-height:1.85;}
.colors{display:flex;gap:10px;flex-wrap:wrap;}
.color-dot{
  width:28px;height:28px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;transition:.2s;
}
.color-dot:hover{transform:scale(1.08);}
.color-dot.sel{border-color:#e9dcc4;transform:scale(1.12);}
.modal-actions{display:flex;align-items:center;gap:10px;margin-top:22px;}
.file-label{display:inline-flex;align-items:center;}

/* ---------- 小屏 ---------- */
@media (max-width:640px){
  :root{--pad-y:32px;--pad-x:26px;--read-fs:15px;--read-lh:1.95;}
  .topbar{padding:20px;}
  .brand{font-size:19px;letter-spacing:.35em;}
  .books{padding:0 20px;gap:8px;}
  .plank{margin:0 12px 30px;}
  .page-viewport{width:92vw;height:calc(100vh - 130px);}
  .nav-btn{width:38px;height:38px;font-size:18px;}
  .reader-top{padding:14px 16px;gap:8px;}
}
</style>
</head>
<body>

<header class="topbar">
  <h1 class="brand">藏<span>书</span>馆</h1>
  <div class="actions">
    <button class="btn" id="btnAdd">＋ 放入一本书</button>
  </div>
</header>

<main id="shelf"></main>

<!-- 阅读器 -->
<div class="reader" id="reader">
  <div class="reader-top">
    <button class="btn btn-sm" id="closeReader">← 书架</button>
    <div class="reader-title" id="readerTitle"></div>
    <div class="reader-progress" id="readerProgress"></div>
    <button class="btn btn-sm" id="btnDelete">移除</button>
  </div>
  <div class="stage">
    <button class="nav-btn" id="prevPage" aria-label="上一页">‹</button>
    <div class="page-viewport" id="pageViewport">
      <div class="page-inner" id="pageInner"></div>
    </div>
    <button class="nav-btn" id="nextPage" aria-label="下一页">›</button>
  </div>
</div>

<!-- 添加书籍 -->
<div class="modal" id="modal">
  <div class="modal-card">
    <h2 class="modal-title">放入一本书</h2>
    <form id="formAdd">
      <div class="field">
        <label>书名</label>
        <input id="fTitle" placeholder="例如：桃花源记" required>
      </div>
      <div class="field">
        <label>作者</label>
        <input id="fAuthor" placeholder="例如：陶渊明">
      </div>
      <div class="field">
        <label>封面色</label>
        <div class="colors" id="colorPick"></div>
      </div>
      <div class="field">
        <label>正文（空行 / 换行分段）</label>
        <textarea id="fContent" placeholder="粘贴文字，或点下方「导入 TXT」……" required></textarea>
      </div>
      <div class="modal-actions">
        <label class="btn btn-sm file-label">
          导入 TXT
          <input type="file" id="fileInput" accept=".txt,text/plain" hidden>
        </label>
        <div style="flex:1"></div>
        <button type="button" class="btn btn-sm" id="modalCancel">取消</button>
        <button type="submit" class="btn btn-sm btn-primary">放上书架</button>
      </div>
    </form>
  </div>
</div>

<script>
/* ================= 数据 ================= */
const KEY = 'my-library-v1';
const PALETTE = ['#a8474a','#4a6b63','#35526e','#7b5d8a','#8a6b3a',
                 '#5c3b2e','#3f5d54','#8c4a2f','#2f4858','#6b4b6e'];

const SEED = [
  {
    id:'seed-taohuayuan', title:'桃花源记', author:'陶渊明', color:'#a8474a',
    content:`晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之，复前行，欲穷其林。
林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。土地平旷，屋舍俨然，有良田美池桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。
见渔人，乃大惊，问所从来。具答之。便要还家，设酒杀鸡作食。村中闻有此人，咸来问讯。自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。问今是何世，乃不知有汉，无论魏晋。此人一一为具言所闻，皆叹惋。余人各复延至其家，皆出酒食。停数日，辞去。此中人语云：不足为外人道也。
既出，得其船，便扶向路，处处志之。及郡下，诣太守，说如此。太守即遣人随其往，寻向所志，遂迷，不复得路。
南阳刘子骥，高尚士也，闻之，欣然规往。未果，寻病终。后遂无问津者。`
  },
  {
    id:'seed-loushiming', title:'陋室铭', author:'刘禹锡', color:'#4a6b63',
    content:`山不在高，有仙则名。水不在深，有龙则灵。斯是陋室，惟吾德馨。苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。可以调素琴，阅金经。无丝竹之乱耳，无案牍之劳形。南阳诸葛庐，西蜀子云亭。孔子云：何陋之有？`
  },
  {
    id:'seed-ailianshuo', title:'爱莲说', author:'周敦颐', color:'#7b5d8a',
    content:`水陆草木之花，可爱者甚蕃。晋陶渊明独爱菊。自李唐来，世人甚爱牡丹。予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。
予谓菊，花之隐逸者也；牡丹，花之富贵者也；莲，花之君子者也。噫！菊之爱，陶后鲜有闻。莲之爱，同予者何人？牡丹之爱，宜乎众矣。`
  },
  {
    id:'seed-jiezishu', title:'诫子书', author:'诸葛亮', color:'#35526e',
    content:`夫君子之行，静以修身，俭以养德。非淡泊无以明志，非宁静无以致远。夫学须静也，才须学也，非学无以广才，非志无以成学。淫慢则不能励精，险躁则不能治性。年与时驰，意与日去，遂成枯落，多不接世，悲守穷庐，将复何及！`
  }
];

/* ================= 状态 ================= */
let books = [];
let currentBook = null;
let pages = [];
let pageIdx = 0;
let chosenColor = PALETTE[0];

/* ================= 工具 ================= */
const $ = id => document.getElementById(id);

function esc(s){
  return String(s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

function loadBooks(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const arr = JSON.parse(raw);
      if(Array.isArray(arr)) return arr;
    }
  }catch(e){ console.warn('读取失败', e); }
  const seed = JSON.parse(JSON.stringify(SEED));
  try{ localStorage.setItem(KEY, JSON.stringify(seed)); }catch(e){}
  return seed;
}

function saveBooks(){
  try{
    localStorage.setItem(KEY, JSON.stringify(books));
  }catch(e){
    alert('保存失败：本地存储空间可能已满（约 5MB 上限）。\n可以移除一些书再试。');
  }
}

/* 由 id 稳定地推导书脊高度，刷新后不变 */
function heightOf(b){
  let h = 0;
  for(let i = 0; i < b.id.length; i++) h = (h * 31 + b.id.charCodeAt(i)) % 997;
  return 168 + (h % 62);
}

/* ================= 书架渲染 ================= */
const BOOK_W = 52, BOOK_GAP = 10;

function renderShelf(){
  const shelf = $('shelf');
  shelf.innerHTML = '';

  if(!books.length){
    shelf.innerHTML = '<div class="empty">书架还空着 —— 点右上角「放入一本书」开始吧</div>';
    return;
  }

  const avail = shelf.clientWidth - 88;
  const rows = [];
  let row = [], w = 0;

  for(const b of books){
    if(w + BOOK_W + BOOK_GAP > avail && row.length){
      rows.push(row); row = []; w = 0;
    }
    row.push(b);
    w += BOOK_W + BOOK_GAP;
  }
  if(row.length) rows.push(row);

  for(const r of rows){
    const rowEl = document.createElement('div');
    rowEl.className = 'shelf-row';

    const booksEl = document.createElement('div');
    booksEl.className = 'books';
    r.forEach(b => booksEl.appendChild(makeBookEl(b)));

    const plank = document.createElement('div');
    plank.className = 'plank';

    rowEl.append(booksEl, plank);
    shelf.appendChild(rowEl);
  }
}

function makeBookEl(b){
  const el = document.createElement('div');
  el.className = 'book';
  el.style.setProperty('--c', b.color || PALETTE[0]);
  el.style.setProperty('--h', heightOf(b) + 'px');

  const t = b.title.length > 9 ? b.title.slice(0, 9) + '…' : b.title;
  const a = (b.author || '佚名');
  el.innerHTML =
    '<div class="spine">' +
      '<span class="b-title">' + esc(t) + '</span>' +
      '<span class="b-author">' + esc(a.length > 6 ? a.slice(0,6) + '…' : a) + '</span>' +
    '</div>';

  el.addEventListener('click', () => openReader(b));
  return el;
}

/* ================= 阅读器 ================= */
function openReader(book){
  currentBook = book;
  $('readerTitle').textContent = book.title + ' · ' + (book.author || '佚名');
  $('reader').classList.add('open');
  document.body.style.overflow = 'hidden';
  pageIdx = 0;
  requestAnimationFrame(() => {
    buildPages();
    showPage(0);
  });
}

function closeReader(){
  $('reader').classList.remove('open');
  document.body.style.overflow = '';
  currentBook = null;
  pages = [];
}

function buildPages(){
  const vp = $('pageViewport');
  const cs = getComputedStyle(document.documentElement);
  const padY = parseFloat(cs.getPropertyValue('--pad-y')) || 52;
  const padX = parseFloat(cs.getPropertyValue('--pad-x')) || 56;

  const cw = vp.clientWidth  - padX * 2;
  const ch = vp.clientHeight - padY * 2;
  if(cw <= 20 || ch <= 20 || !currentBook) return;

  const meas = document.createElement('div');
  meas.className = 'page-measure';
  meas.style.width = cw + 'px';
  document.body.appendChild(meas);

  const paras = currentBook.content
    .split(/\n+/)
    .map(s => s.trim())
    .filter(Boolean);

  pages = [];
  let cur = [];

  for(const text of paras){
    const p = document.createElement('p');
    p.textContent = text;
    meas.appendChild(p);

    if(meas.offsetHeight > ch && meas.children.length > 1){
      meas.removeChild(p);
      pages.push(cur.map(e => e.outerHTML).join(''));
      cur = [];
      meas.innerHTML = '';
      meas.appendChild(p);
    }
    cur.push(p);
  }
  if(cur.length) pages.push(cur.map(e => e.outerHTML).join(''));
  if(!pages.length) pages = ['<p>（这本书还没有内容）</p>'];

  document.body.removeChild(meas);
}

function showPage(i){
  if(!pages.length) return;
  pageIdx = Math.max(0, Math.min(i, pages.length - 1));

  const inner = $('pageInner');
  inner.innerHTML = pages[pageIdx];
  inner.style.animation = 'none';
  void inner.offsetWidth;
  inner.style.animation = '';

  $('prevPage').disabled = (pageIdx === 0);
  $('nextPage').disabled = (pageIdx === pages.length - 1);
  $('readerProgress').textContent = (pageIdx + 1) + ' / ' + pages.length;
}

/* ================= 弹窗 & 表单 ================= */
function openModal(){
  $('modal').classList.add('open');
  setTimeout(() => $('fTitle').focus(), 60);
}
function closeModal(){
  $('modal').classList.remove('open');
}

function buildColorPicker(){
  const box = $('colorPick');
  box.innerHTML = '';
  PALETTE.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'color-dot' + (i === 0 ? ' sel' : '');
    d.style.background = c;
    d.addEventListener('click', () => {
      box.querySelectorAll('.color-dot').forEach(x => x.classList.remove('sel'));
      d.classList.add('sel');
      chosenColor = c;
    });
    box.appendChild(d);
  });
  chosenColor = PALETTE[0];
}

function onSubmitBook(e){
  e.preventDefault();
  const title   = $('fTitle').value.trim();
  const author  = $('fAuthor').value.trim();
  const content = $('fContent').value.trim();

  if(!title || !content){
    alert('书名和正文不能为空');
    return;
  }

  books.push({
    id: 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    title,
    author: author || '佚名',
    color: chosenColor,
    content
  });

  saveBooks();
  renderShelf();
  closeModal();
  e.target.reset();
  buildColorPicker();
}

function onImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    $('fTitle').value = file.name.replace(/\.[^.]+$/, '');
    $('fContent').value = reader.result;
  };
  reader.readAsText(file, 'utf-8');
  e.target.value = '';
}

function deleteCurrent(){
  if(!currentBook) return;
  if(!confirm('确定把《' + currentBook.title + '》从书架上移除吗？')) return;
  books = books.filter(b => b.id !== currentBook.id);
  saveBooks();
  renderShelf();
  closeReader();
}

/* ================= 事件绑定 ================= */
function bindEvents(){
  $('btnAdd').addEventListener('click', openModal);
  $('modalCancel').addEventListener('click', closeModal);
  $('formAdd').addEventListener('submit', onSubmitBook);
  $('fileInput').addEventListener('change', onImportFile);

  $('closeReader').addEventListener('click', closeReader);
  $('btnDelete').addEventListener('click', deleteCurrent);
  $('prevPage').addEventListener('click', () => showPage(pageIdx - 1));
  $('nextPage').addEventListener('click', () => showPage(pageIdx + 1));

  // 点纸张左右两侧翻页
  $('pageViewport').addEventListener('click', e => {
    const r = e.currentTarget.getBoundingClientRect();
    const x = e.clientX - r.left;
    if(x > r.width * 0.62) showPage(pageIdx + 1);
    else if(x < r.width * 0.38) showPage(pageIdx - 1);
  });

  // 点击遮罩关闭弹窗
  $('modal').addEventListener('click', e => {
    if(e.target === $('modal')) closeModal();
  });

  // 键盘
  document.addEventListener('keydown', e => {
    const reading = $('reader').classList.contains('open');
    const modalOpen = $('modal').classList.contains('open');

    if(e.key === 'Escape'){
      if(modalOpen) closeModal();
      else if(reading) closeReader();
      return;
    }
    if(!reading || modalOpen) return;

    if(e.key === 'ArrowLeft'  || e.key === 'PageUp')   { e.preventDefault(); showPage(pageIdx - 1); }
    if(e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
      e.preventDefault(); showPage(pageIdx + 1);
    }
  });

  // 窗口尺寸变化：重排书架 + 重新分页（保留阅读进度）
  let timer;
  window.addEventListener('resize', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      renderShelf();
      if($('reader').classList.contains('open')){
        const ratio = pages.length > 1 ? pageIdx / (pages.length - 1) : 0;
        buildPages();
        showPage(Math.round(ratio * (pages.length - 1)));
      }
    }, 180);
  });
}

/* ================= 启动 ================= */
(function init(){
  books = loadBooks();
  buildColorPicker();
  renderShelf();
  bindEvents();
})();
</script>
</body>
