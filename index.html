<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>藏书馆 · Editorial Library</title>
<!-- 引入优雅的衬线字体 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  /* 核心色彩 */
  --bg-dark: #0a0a0c;
  --bg-detail: #7cd4e8; /* 图2的蓝绿色背景 */
  --text-main: #f4f4f5;
  --text-muted: #8b8b93;
  --text-dark: #111111; /* 浅色背景上的文字 */
  --accent-gold: #c6a87c;
  
  /* 字体 */
  --font-serif: 'Playfair Display', 'Noto Serif SC', 'Songti SC', Georgia, serif;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
  
  /* 布局变量 */
  --shelf-width: 960px;
  --transition: cubic-bezier(0.16, 1, 0.3, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: var(--bg-dark);
  color: var(--text-main);
  font-family: var(--font-sans);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ---------- 侧边导航栏 (图1左侧细节) ---------- */
.side-nav {
  position: fixed;
  left: 30px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 12px;
  z-index: 50;
  pointer-events: none;
}
.side-nav .dot {
  width: 18px;
  height: 2px;
  background: rgba(255,255,255,0.15);
  transition: all 0.4s var(--transition);
}
.side-nav .dot.active {
  background: var(--accent-gold);
  width: 30px;
}

/* ---------- 顶部 Logo ---------- */
.logo {
  position: fixed;
  top: 40px;
  left: 40px;
  font-family: var(--font-serif);
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 0.1em;
  color: var(--text-main);
  z-index: 50;
  mix-blend-mode: difference;
}

/* ---------- 书架视图 ---------- */
.shelf-view {
  max-width: var(--shelf-width);
  margin: 0 auto;
  padding: 120px 20px 100px;
  display: flex;
  flex-direction: column;
  gap: 32px;
  transition: opacity 0.6s var(--transition), transform 0.6s var(--transition);
}
.shelf-view.hidden {
  opacity: 0;
  pointer-events: none;
  transform: translateY(-20px);
}

.book-item {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 100px;
  padding: 0 40px;
  border-radius: 4px;
  cursor: pointer;
  overflow: hidden;
  background: var(--c);
  box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
  transition: transform 0.5s var(--transition), box-shadow 0.5s var(--transition);
}
.book-item:hover {
  transform: scale(1.02) translateX(10px);
  box-shadow: 0 20px 40px -10px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.2);
}
/* 书籍纹理效果 */
.book-item::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size: 4px 4px;
  opacity: 0.3;
  pointer-events: none;
}
.book-author {
  font-family: var(--font-sans);
  font-size: 13px;
  letter-spacing: 0.08em;
  color: rgba(255,255,255,0.7);
  width: 20%;
  text-transform: uppercase;
}
.book-title {
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: 400;
  letter-spacing: 0.05em;
  color: #fff;
  flex: 1;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.book-logo {
  width: 20%;
  text-align: right;
  font-size: 18px;
  color: rgba(255,255,255,0.4);
  font-family: var(--font-serif);
  font-style: italic;
}

/* ---------- 详情/阅读视图 (图2) ---------- */
.detail-view {
  position: fixed;
  inset: 0;
  background-color: var(--bg-detail);
  color: var(--text-dark);
  z-index: 100;
  display: flex;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s var(--transition);
  overflow: hidden;
}
.detail-view.open {
  opacity: 1;
  pointer-events: auto;
}

.detail-left {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 1500px;
  padding: 60px;
}
.book-3d {
  width: 320px;
  height: 480px;
  position: relative;
  transform-style: preserve-3d;
  transform: rotateY(-25deg) rotateX(10deg);
  box-shadow: 40px 40px 60px rgba(0,0,0,0.2);
  transition: transform 1s var(--transition);
}
.detail-view.open .book-3d {
  transform: rotateY(-15deg) rotateX(5deg);
}
.book-cover {
  position: absolute;
  inset: 0;
  background-color: #1a1a1a;
  border-radius: 2px 6px 6px 2px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 30px;
  color: #fff;
  background-size: cover;
}
/* 书脊效果 */
.book-spine {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 30px;
  background: linear-gradient(90deg, rgba(0,0,0,0.8), rgba(0,0,0,0.2));
  transform: rotateY(-90deg) translateX(-15px);
  transform-origin: left;
  border-radius: 2px 0 0 2px;
}
.cover-title {
  font-family: var(--font-serif);
  font-size: 28px;
  line-height: 1.3;
  margin-top: 40px;
}
.cover-author {
  font-size: 13px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  opacity: 0.7;
}

.detail-right {
  flex: 1.2;
  padding: 100px 80px 60px 40px;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.detail-header {
  margin-bottom: 40px;
}
.detail-title {
  font-family: var(--font-serif);
  font-size: 42px;
  font-weight: 600;
  color: var(--text-dark);
  margin-bottom: 12px;
  line-height: 1.2;
}
.detail-author {
  font-family: var(--font-serif);
  font-size: 20px;
  font-style: italic;
  color: rgba(0,0,0,0.6);
}
.divider {
  width: 40px;
  height: 1px;
  background: rgba(0,0,0,0.3);
  margin: 24px 0;
}
.detail-content {
  font-family: var(--font-serif);
  font-size: 18px;
  line-height: 1.8;
  color: rgba(0,0,0,0.85);
  max-width: 600px;
}
.detail-content p {
  margin-bottom: 1.2em;
  text-indent: 2em;
}

/* 关闭按钮 */
.close-btn {
  position: fixed;
  top: 40px;
  left: 40px;
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(0,0,0,0.05);
  color: var(--text-dark);
  font-size: 24px;
  cursor: pointer;
  transition: background 0.3s;
  z-index: 110;
}
.close-btn:hover {
  background: rgba(0,0,0,0.15);
}

/* ---------- 添加按钮 (极简) ---------- */
.add-btn {
  position: fixed;
  bottom: 40px;
  right: 40px;
  padding: 16px 32px;
  background: transparent;
  color: var(--text-main);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 40px;
  font-family: var(--font-sans);
  font-size: 13px;
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: all 0.3s;
  z-index: 50;
}
.add-btn:hover {
  background: rgba(255,255,255,0.1);
  border-color: #fff;
}

/* ---------- 弹窗 ---------- */
.modal {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(10,10,12,0.9);
  backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.4s;
}
.modal.open { opacity: 1; pointer-events: auto; }
.modal-card {
  width: min(540px, 92vw);
  background: #141416;
  padding: 40px;
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.08);
}
.modal-title {
  font-family: var(--font-serif);
  font-size: 24px;
  margin-bottom: 30px;
  color: var(--text-main);
}
.field { margin-bottom: 20px; }
.field label {
  display: block; font-size: 11px; letter-spacing: 0.15em;
  color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase;
}
.field input, .field textarea {
  width: 100%; padding: 14px;
  background: #0a0a0c; border: 1px solid rgba(255,255,255,0.1);
  color: #fff; font-family: var(--font-sans); font-size: 14px;
  outline: none; transition: border-color 0.3s;
}
.field input:focus, .field textarea:focus { border-color: var(--accent-gold); }
.field textarea { min-height: 140px; resize: vertical; line-height: 1.6; }
.color-dot {
  display: inline-block; width: 24px; height: 24px;
  border-radius: 50%; margin-right: 12px; cursor: pointer;
  border: 2px solid transparent; transition: transform 0.2s;
}
.color-dot:hover { transform: scale(1.15); }
.color-dot.sel { border-color: #fff; transform: scale(1.1); }
.modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 30px; }
.btn {
  padding: 12px 24px; border: none; border-radius: 2px;
  font-family: var(--font-sans); font-size: 13px; cursor: pointer;
  transition: all 0.3s;
}
.btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid rgba(255,255,255,0.1); }
.btn-ghost:hover { color: #fff; border-color: #fff; }
.btn-primary { background: var(--accent-gold); color: #111; font-weight: 500; }
.btn-primary:hover { background: #d4b88a; }

/* 移动端适配 */
@media (max-width: 860px) {
  .detail-view { flex-direction: column; overflow-y: auto; }
  .detail-left { padding: 40px 20px; }
  .book-3d { width: 200px; height: 300px; }
  .detail-right { padding: 0 30px 60px; overflow: visible; }
  .detail-title { font-size: 32px; }
  .side-nav { display: none; }
  .book-item { padding: 0 20px; height: 80px; }
  .book-author { display: none; }
  .book-title { font-size: 18px; }
}
</style>
</head>
<body>

<!-- 侧边导航 -->
<nav class="side-nav" id="sideNav"></nav>
<div class="logo">BIBLIOTHECA</div>

<!-- 书架视图 -->
<main class="shelf-view" id="shelfView"></main>

<!-- 详情/阅读视图 -->
<div class="detail-view" id="detailView">
  <div class="close-btn" id="closeDetail">←</div>
  <div class="detail-left">
    <div class="book-3d" id="book3d">
      <div class="book-spine"></div>
      <div class="book-cover" id="bookCover">
        <div class="cover-title" id="coverTitle"></div>
        <div class="cover-author" id="coverAuthor"></div>
      </div>
    </div>
  </div>
  <div class="detail-right">
    <div class="detail-header">
      <h1 class="detail-title" id="detailTitle"></h1>
      <div class="detail-author" id="detailAuthor"></div>
      <div class="divider"></div>
    </div>
    <div class="detail-content" id="detailContent"></div>
  </div>
</div>

<!-- 添加书籍弹窗 -->
<div class="modal" id="modal">
  <div class="modal-card">
    <h2 class="modal-title">Acquire a Book</h2>
    <form id="formAdd">
      <div class="field">
        <label>书名 / Title</label>
        <input id="fTitle" placeholder="例如：桃花源记" required>
      </div>
      <div class="field">
        <label>作者 / Author</label>
        <input id="fAuthor" placeholder="例如：陶渊明">
      </div>
      <div class="field">
        <label>封面色 / Cover Color</label>
        <div id="colorPick"></div>
      </div>
      <div class="field">
        <label>正文 / Content</label>
        <textarea id="fContent" placeholder="粘贴文本，空行分段..." required></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="modalCancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Add to Shelf</button>
      </div>
    </form>
  </div>
</div>

<button class="add-btn" id="btnAdd">＋ 放入一本书</button>

<script>
/* ================= 数据 ================= */
const KEY = 'editorial-library-v1';
const PALETTE = [
  { name: 'Burgundy', c: '#6e2c2e' },
  { name: 'Navy', c: '#2a3c50' },
  { name: 'Olive', c: '#5a5a40' },
  { name: 'Cream', c: '#d8cbb6' },
  { name: 'Slate', c: '#4a4a4a' },
  { name: 'Teal', c: '#2d5a5e' }
];

const SEED = [
  { id:'b1', title:'桃花源记', author:'陶渊明', color:'#6e2c2e', content:`晋太元中，武陵人捕鱼为业...` },
  { id:'b2', title:'陋室铭', author:'刘禹锡', color:'#2a3c50', content:`山不在高，有仙则名...` },
  { id:'b3', title:'爱莲说', author:'周敦颐', color:'#5a5a40', content:`水陆草木之花，可爱者甚蕃...` },
  { id:'b4', title:'诫子书', author:'诸葛亮', color:'#4a4a4a', content:`夫君子之行，静以修身...` }
];

let books = [];
let currentBook = null;
let chosenColor = PALETTE[0].c;

/* ================= 工具 ================= */
const $ = id => document.getElementById(id);

/* 存储 */
function loadBooks() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  const seed = JSON.parse(JSON.stringify(SEED));
  localStorage.setItem(KEY, JSON.stringify(seed));
  return seed;
}
function saveBooks() {
  try { localStorage.setItem(KEY, JSON.stringify(books)); } catch(e) { alert('存储空间不足'); }
}

/* ================= 渲染书架 ================= */
function renderShelf() {
  const shelf = $('shelfView');
  const nav = $('sideNav');
  shelf.innerHTML = '';
  nav.innerHTML = '';

  books.forEach((b, i) => {
    // 导航点
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    nav.appendChild(dot);

    // 书籍行
    const item = document.createElement('div');
    item.className = 'book-item';
    item.style.setProperty('--c', b.color || PALETTE[0].c);
    
    // 图1风格：作者在左，书名居中，图标在右
    item.innerHTML = `
      <div class="book-author">${b.author || '佚名'}</div>
      <div class="book-title">${b.title}</div>
      <div class="book-logo">©</div>
    `;
    
    item.addEventListener('click', () => openDetail(b));
    shelf.appendChild(item);
  });
}

/* ================= 详情/阅读视图 ================= */
function openDetail(book) {
  currentBook = book;
  
  // 填充内容
  $('coverTitle').textContent = book.title;
  $('coverAuthor').textContent = book.author || '佚名';
  $('bookCover').style.backgroundColor = book.color || PALETTE[0].c;
  $('detailTitle').textContent = book.title;
  $('detailAuthor').textContent = book.author || '佚名';
  
  // 将内容按段落拆分，生成高级的杂志排版
  const paras = book.content.split(/\n+/).map(s => s.trim()).filter(Boolean);
  $('detailContent').innerHTML = paras.map(p => `<p>${p}</p>`).join('');

  // 显示视图
  $('shelfView').classList.add('hidden');
  $('detailView').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  $('detailView').classList.remove('open');
  $('shelfView').classList.remove('hidden');
  document.body.style.overflow = '';
  currentBook = null;
}

/* ================= 弹窗 & 表单 ================= */
function openModal() {
  $('modal').classList.add('open');
  setTimeout(() => $('fTitle').focus(), 100);
}
function closeModal() {
  $('modal').classList.remove('open');
}

function buildColorPicker() {
  const box = $('colorPick');
  box.innerHTML = '';
  PALETTE.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'color-dot' + (i === 0 ? ' sel' : '');
    d.style.backgroundColor = p.c;
    d.title = p.name;
    d.addEventListener('click', () => {
      box.querySelectorAll('.color-dot').forEach(x => x.classList.remove('sel'));
      d.classList.add('sel');
      chosenColor = p.c;
    });
    box.appendChild(d);
  });
  chosenColor = PALETTE[0].c;
}

function onSubmitBook(e) {
  e.preventDefault();
  const title = $('fTitle').value.trim();
  const author = $('fAuthor').value.trim();
  const content = $('fContent').value.trim();
  if (!title || !content) return alert('书名和正文不能为空');

  books.push({
    id: 'b' + Date.now().toString(36),
    title, author: author || '佚名',
    color: chosenColor,
    content
  });

  saveBooks();
  renderShelf();
  closeModal();
  e.target.reset();
  buildColorPicker();
}

/* ================= 事件绑定 ================= */
function bindEvents() {
  $('btnAdd').addEventListener('click', openModal);
  $('modalCancel').addEventListener('click', closeModal);
  $('formAdd').addEventListener('submit', onSubmitBook);
  $('closeDetail').addEventListener('click', closeDetail);

  // 点击弹窗遮罩关闭
  $('modal').addEventListener('click', e => {
    if (e.target === $('modal')) closeModal();
  });

  // 键盘 Esc 关闭
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if ($('modal').classList.contains('open')) closeModal();
      else if ($('detailView').classList.contains('open')) closeDetail();
    }
  });
}

/* ================= 启动 ================= */
(function init() {
  books = loadBooks();
  buildColorPicker();
  renderShelf();
  bindEvents();
})();
</script>
</body>
</html>
